<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Budget Tracker</title>

<link rel="stylesheet" href="stylesheet.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="icon.png">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- === AUTH === -->
<div id="auth-container">

  <div class="auth-box">

    <div class="auth-header">
      <h1>💰 Smart Budget</h1>
      <p>Track your money smarter</p>
    </div>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <div class="auth-buttons">
      <button id="signupBtn" type="button">Create Account</button>
      <button id="loginBtn" type="button">Login</button>
    </div>

  </div>

</div>

<!-- === APP === -->
<div id="app" style="display:none;">

  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <h2>Dashboard</h2>

      <div class="top-actions">
        <button id="toggleDark" type="button">🌙</button>
        <button id="exportBtn" type="button">Export PDF</button>
        <button id="logoutBtn" type="button">Logout</button>
        <button id="upgradeBtn" type="button">💎 Pro</button>
      </div>
    </div>

    <!-- SUMMARY CARDS -->
    <div class="dashboard-grid">

      <div class="dashboard-card income-card">
        <h4>Income</h4>
        <p id="money-plus">$0.00</p>
      </div>

      <div class="dashboard-card expense-card">
        <h4>Expenses</h4>
        <p id="money-minus">$0.00</p>
      </div>

      <div class="dashboard-card balance-card">
        <h4>Balance</h4>
        <p id="balance">$0.00</p>
      </div>

    </div>

    <!-- FILTER -->
    <div class="filter-section">
      <button id="filterAll">All</button>
      <button id="filterDay">Daily</button>
      <button id="filterWeek">Weekly</button>
      <button id="filterMonth">Monthly</button>
    </div>

    <!-- TRANSACTIONS -->
    <div class="section">
      <h3>Transactions</h3>
      <ul id="list"></ul>
    </div>

    <!-- ADD -->
    <div class="section">
      <h3>Add Transaction</h3>

      <form id="form">
        <input type="text" id="text" placeholder="Description" required>
        <input type="number" id="amount" placeholder="Amount" required>

        <select id="category" required>
          <option value="">Select Category</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Salary</option>
          <option>Bills</option>
          <option>Other</option>
        </select>

        <button type="submit">Add</button>
      </form>
    </div>

    <!-- CHART -->
    <div class="section">
      <h3>Analytics</h3>
      <canvas id="expenseChart"></canvas>
    </div>

  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
